<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Inter Moni Demo</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <section class="auth-section">
    <div class="auth-box">
      <h1>INTER MONI</h1>
      <p>Demo account registration</p>

      <form id="registerForm">
        <input type="text" id="name" placeholder="Full name" required>
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password (at least 6 characters)" minlength="6" required>

        <button type="submit">Create Demo Account</button>
      </form>

      <p id="message" role="status"></p>
      <p>Already registered? <a href="login.html">Login</a></p>
      <a href="index.html">Back to home</a>
    </div>
  </section>

  <script type="module" src="auth.js"></script>
</body>
</html>
